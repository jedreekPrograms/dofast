name: ${COMPOSE_PROJECT_NAME:-dofast}

services:
  db:
    image: mariadb:11.4.13
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-dofast}
      MARIADB_USER: ${DB_USER:-dofast}
      MARIADB_PASSWORD: ${DB_PASSWORD:-dofast-local-password}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-dofast-local-root-password}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - dofast

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mariadb://db:3306/${DB_NAME:-dofast}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-dofast}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-dofast-local-password}
      JWT_SECRET: ${JWT_SECRET:-local-only-change-this-jwt-secret-please-32-bytes-minimum}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_replace_me}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_replace_me}
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - dofast

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-5173}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dofast

volumes:
  mariadb_data:

networks:
  dofast:
    driver: bridge
