name: ${COMPOSE_PROJECT_NAME:-dofast}

services:
  db:
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-dofast}
      POSTGRES_USER: ${DB_USER:-dofast}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dofast-local-password}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - dofast

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-dofast}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-dofast}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-dofast-local-password}
      JWT_SECRET: ${JWT_SECRET:-local-only-change-this-jwt-secret-please-32-bytes-minimum}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      GOOGLE_AUTH_CLIENT_ID: ${GOOGLE_AUTH_CLIENT_ID:-}
      APPLE_AUTH_CLIENT_ID: ${APPLE_AUTH_CLIENT_ID:-}
      APPLE_AUTH_REDIRECT_URI: ${APPLE_AUTH_REDIRECT_URI:-}
      APPLE_AUTH_TEAM_ID: ${APPLE_AUTH_TEAM_ID:-}
      APPLE_AUTH_KEY_ID: ${APPLE_AUTH_KEY_ID:-}
      APPLE_AUTH_PRIVATE_KEY_BASE64: ${APPLE_AUTH_PRIVATE_KEY_BASE64:-}
      APPLE_AUTH_CHALLENGE_TTL_MINUTES: ${APPLE_AUTH_CHALLENGE_TTL_MINUTES:-10}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      ADMIN_BOOTSTRAP_NICKNAME: ${ADMIN_BOOTSTRAP_NICKNAME:-doFast Admin}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_replace_me}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_replace_me}
      ROUTING_PROVIDER: ${ROUTING_PROVIDER:-deterministic}
      ROUTING_QUOTE_TTL_MINUTES: ${ROUTING_QUOTE_TTL_MINUTES:-15}
      GOOGLE_MAPS_ROUTES_API_KEY: ${GOOGLE_MAPS_ROUTES_API_KEY:-}
      TRACKING_ETA_REFRESH_SECONDS: ${TRACKING_ETA_REFRESH_SECONDS:-30}
      TRACKING_ETA_REFRESH_MOVEMENT_METERS: ${TRACKING_ETA_REFRESH_MOVEMENT_METERS:-150}
      TRACKING_STALE_AFTER_SECONDS: ${TRACKING_STALE_AFTER_SECONDS:-20}
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - dofast

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_GOOGLE_AUTH_CLIENT_ID: ${VITE_GOOGLE_AUTH_CLIENT_ID:-}
        VITE_APPLE_AUTH_CLIENT_ID: ${VITE_APPLE_AUTH_CLIENT_ID:-}
        VITE_APPLE_AUTH_REDIRECT_URI: ${VITE_APPLE_AUTH_REDIRECT_URI:-}
        VITE_GOOGLE_MAPS_BROWSER_KEY: ${VITE_GOOGLE_MAPS_BROWSER_KEY:-}
        VITE_GOOGLE_MAPS_MAP_ID: ${VITE_GOOGLE_MAPS_MAP_ID:-DEMO_MAP_ID}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-5173}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dofast

volumes:
  postgres_data:

networks:
  dofast:
    driver: bridge