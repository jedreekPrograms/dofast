version: "3.9"

services:

  db:
    image: mariadb:11
    container_name: dofast-db
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: dofast
      MARIADB_USER: dofast
      MARIADB_PASSWORD: dofast
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"

  app:
    build: .
    container_name: dofast-app
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://db:3306/dofast
      SPRING_DATASOURCE_USERNAME: dofast
      SPRING_DATASOURCE_PASSWORD: dofast
      STRIPE_SECRET_KEY: sk_test_xxx
      STRIPE_WEBHOOK_SECRET: whsec_xxx

volumes:
  db_data:
