version: "3.9"

services:
  db:
    image: mariadb:11
    container_name: dofast-db
    restart: always
    environment:
      MARIADB_DATABASE: dofast
      MARIADB_USER: dofast
      MARIADB_PASSWORD: dofast
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"

  app:
    build: .
    container_name: dofast-app
    restart: always
    depends_on:
      - db
    ports:
      - "8080:8080"
    env_file:
      - .env

volumes:
  db_data: