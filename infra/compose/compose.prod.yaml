name: dofast-prod

services:
  db:
    image: postgis/postgis:18-3.6
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - backend

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:?DB_NAME is required}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:?DB_USER is required}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-10}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-2}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      WEBSOCKET_ALLOWED_ORIGIN_PATTERNS: ${WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:?WEBSOCKET_ALLOWED_ORIGIN_PATTERNS is required}
      GOOGLE_AUTH_CLIENT_ID: ${GOOGLE_AUTH_CLIENT_ID:-}
      APPLE_AUTH_CLIENT_ID: ${APPLE_AUTH_CLIENT_ID:-}
      APPLE_AUTH_REDIRECT_URI: ${APPLE_AUTH_REDIRECT_URI:-}
      APPLE_AUTH_TEAM_ID: ${APPLE_AUTH_TEAM_ID:-}
      APPLE_AUTH_KEY_ID: ${APPLE_AUTH_KEY_ID:-}
      APPLE_AUTH_PRIVATE_KEY_BASE64: ${APPLE_AUTH_PRIVATE_KEY_BASE64:-}
      APPLE_AUTH_CHALLENGE_TTL_MINUTES: ${APPLE_AUTH_CHALLENGE_TTL_MINUTES:-10}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      ADMIN_BOOTSTRAP_NICKNAME: ${ADMIN_BOOTSTRAP_NICKNAME:-doFast Admin}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?STRIPE_SECRET_KEY is required}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?STRIPE_WEBHOOK_SECRET is required}
      PLATFORM_FEE_BASIS_POINTS: ${PLATFORM_FEE_BASIS_POINTS:?PLATFORM_FEE_BASIS_POINTS is required}
      PAYOUT_PROVIDER: ${PAYOUT_PROVIDER:-disabled}
      PAYOUT_SANDBOX_ENABLED: ${PAYOUT_SANDBOX_ENABLED:-false}
      PAYOUT_MINIMUM_AMOUNT: ${PAYOUT_MINIMUM_AMOUNT:-1.00}
      PAYOUT_MAX_ATTEMPTS: ${PAYOUT_MAX_ATTEMPTS:-5}
      PAYOUT_RETRY_BASE_SECONDS: ${PAYOUT_RETRY_BASE_SECONDS:-15}
      PAYOUT_STALE_PROCESSING_SECONDS: ${PAYOUT_STALE_PROCESSING_SECONDS:-300}
      PAYOUT_DISPATCH_INTERVAL_MS: ${PAYOUT_DISPATCH_INTERVAL_MS:-2000}
      PAYOUT_STRIPE_CONNECT_ENABLED: ${PAYOUT_STRIPE_CONNECT_ENABLED:-false}
      PAYOUT_STRIPE_CONNECT_DISPATCH_ENABLED: ${PAYOUT_STRIPE_CONNECT_DISPATCH_ENABLED:-false}
      PAYOUT_STRIPE_CONNECT_COUNTRY: ${PAYOUT_STRIPE_CONNECT_COUNTRY:-PL}
      PAYOUT_STRIPE_CONNECT_REFRESH_URL: ${PAYOUT_STRIPE_CONNECT_REFRESH_URL:-}
      PAYOUT_STRIPE_CONNECT_RETURN_URL: ${PAYOUT_STRIPE_CONNECT_RETURN_URL:-}
      ROUTING_PROVIDER: ${ROUTING_PROVIDER:-google}
      ROUTING_QUOTE_TTL_MINUTES: ${ROUTING_QUOTE_TTL_MINUTES:-15}
      GOOGLE_MAPS_ROUTES_API_KEY: ${GOOGLE_MAPS_ROUTES_API_KEY:?GOOGLE_MAPS_ROUTES_API_KEY is required}
      TRACKING_ETA_REFRESH_SECONDS: ${TRACKING_ETA_REFRESH_SECONDS:-30}
      TRACKING_ETA_REFRESH_MOVEMENT_METERS: ${TRACKING_ETA_REFRESH_MOVEMENT_METERS:-150}
      TRACKING_STALE_AFTER_SECONDS: ${TRACKING_STALE_AFTER_SECONDS:-20}
      TRACKING_CHECKPOINT_ARRIVAL_RADIUS_METERS: ${TRACKING_CHECKPOINT_ARRIVAL_RADIUS_METERS:-100}
      TRACKING_MAX_IMPLIED_SPEED_METERS_PER_SECOND: ${TRACKING_MAX_IMPLIED_SPEED_METERS_PER_SECOND:-80}
      TRACKING_MAX_ACCURACY_METERS: ${TRACKING_MAX_ACCURACY_METERS:-150}
      TRACKING_MIN_UPDATE_INTERVAL_MILLIS: ${TRACKING_MIN_UPDATE_INTERVAL_MILLIS:-1000}
      TRACKING_MAX_SAMPLE_AGE_SECONDS: ${TRACKING_MAX_SAMPLE_AGE_SECONDS:-120}
      TRACKING_FUTURE_TOLERANCE_SECONDS: ${TRACKING_FUTURE_TOLERANCE_SECONDS:-30}
      ATTACHMENT_STORAGE_ROOT: /var/lib/dofast/attachments
      ATTACHMENT_ENCRYPTION_KEY_BASE64: ${ATTACHMENT_ENCRYPTION_KEY_BASE64:?ATTACHMENT_ENCRYPTION_KEY_BASE64 is required}
      ATTACHMENT_MAX_FILE_SIZE: ${ATTACHMENT_MAX_FILE_SIZE:-10MB}
      ATTACHMENT_MAX_REQUEST_SIZE: ${ATTACHMENT_MAX_REQUEST_SIZE:-11MB}
      ATTACHMENT_MAX_FILE_SIZE_BYTES: ${ATTACHMENT_MAX_FILE_SIZE_BYTES:-10485760}
      ATTACHMENT_MAX_PER_JOB: ${ATTACHMENT_MAX_PER_JOB:-12}
    volumes:
      - attachment_data:/var/lib/dofast/attachments
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - backend

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_GOOGLE_AUTH_CLIENT_ID: ${VITE_GOOGLE_AUTH_CLIENT_ID:-}
        VITE_APPLE_AUTH_CLIENT_ID: ${VITE_APPLE_AUTH_CLIENT_ID:-}
        VITE_APPLE_AUTH_REDIRECT_URI: ${VITE_APPLE_AUTH_REDIRECT_URI:-}
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:?VITE_STRIPE_PUBLISHABLE_KEY is required}
        VITE_GOOGLE_MAPS_BROWSER_KEY: ${VITE_GOOGLE_MAPS_BROWSER_KEY:?VITE_GOOGLE_MAPS_BROWSER_KEY is required}
        VITE_GOOGLE_MAPS_MAP_ID: ${VITE_GOOGLE_MAPS_MAP_ID:?VITE_GOOGLE_MAPS_MAP_ID is required}
    restart: always
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend

volumes:
  postgres_data:
  attachment_data:

networks:
  backend:
    driver: bridge
