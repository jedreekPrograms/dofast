log_format dofast_main '$remote_addr [$time_local] '
                       '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                       '$request_time "$http_user_agent"';

# Transport-level protection complements the authenticated STOMP limiter in the API.
# These zones are intentionally keyed by the direct peer address; production should expose
# this gateway only through infrastructure that preserves a trustworthy client address.
limit_req_zone $binary_remote_addr zone=dofast_ws_handshake:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=dofast_sockjs_transport:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=dofast_ws_connections:10m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    access_log /var/log/nginx/access.log dofast_main;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin" always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Native WebSocket handshakes are cheap when legitimate but can otherwise consume
    # servlet and proxy connection capacity before STOMP authentication has a chance to run.
    location = /ws {
        limit_req zone=dofast_ws_handshake burst=10 nodelay;
        limit_req_status 429;
        limit_conn dofast_ws_connections 8;
        limit_conn_status 429;

        client_max_body_size 64k;
        proxy_pass http://api:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 30s;
    }

    # SockJS uses multiple HTTP requests per logical session, so it receives a deliberately
    # higher request budget while still being bounded before requests reach Spring.
    location = /ws-sockjs {
        limit_req zone=dofast_sockjs_transport burst=60 nodelay;
        limit_req_status 429;
        limit_conn dofast_ws_connections 20;
        limit_conn_status 429;

        client_max_body_size 64k;
        proxy_pass http://api:8080/ws-sockjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 30s;
    }

    location ^~ /ws-sockjs/ {
        limit_req zone=dofast_sockjs_transport burst=60 nodelay;
        limit_req_status 429;
        limit_conn dofast_ws_connections 20;
        limit_conn_status 429;

        client_max_body_size 64k;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
