spring:
  application:
    name: dofast-api
  profiles:
    default: local
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      initialization-fail-timeout: 60000
      connection-timeout: 30000
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  address: 0.0.0.0
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN

stripe:
  secret:
    key: ${STRIPE_SECRET_KEY:sk_test_not_configured}
  webhook:
    secret: ${STRIPE_WEBHOOK_SECRET:whsec_not_configured}

dofast:
  security:
    jwt:
      secret: ${JWT_SECRET:local-only-change-this-jwt-secret-please-32-bytes-minimum}
      expiration-ms: ${JWT_EXPIRATION_MS:3600000}
    admin-bootstrap:
      email: ${ADMIN_BOOTSTRAP_EMAIL:}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:}
      nickname: ${ADMIN_BOOTSTRAP_NICKNAME:doFast Admin}
    websocket:
      allowed-origin-patterns: ${WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
  routing:
    provider: ${ROUTING_PROVIDER:deterministic}
    quote-ttl-minutes: ${ROUTING_QUOTE_TTL_MINUTES:15}
    google:
      api-key: ${GOOGLE_MAPS_ROUTES_API_KEY:}
  tracking:
    eta-refresh-seconds: ${TRACKING_ETA_REFRESH_SECONDS:30}
    eta-refresh-movement-meters: ${TRACKING_ETA_REFRESH_MOVEMENT_METERS:150}
    stale-after-seconds: ${TRACKING_STALE_AFTER_SECONDS:20}
    max-implied-speed-meters-per-second: ${TRACKING_MAX_IMPLIED_SPEED_METERS_PER_SECOND:80}
    min-update-interval-millis: ${TRACKING_MIN_UPDATE_INTERVAL_MILLIS:1000}
