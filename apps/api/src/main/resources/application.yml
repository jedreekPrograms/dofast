spring:
  application:
    name: dofast-api
  profiles:
    default: local
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      initialization-fail-timeout: 60000
      connection-timeout: 30000
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  servlet:
    multipart:
      max-file-size: ${ATTACHMENT_MAX_FILE_SIZE:10MB}
      max-request-size: ${ATTACHMENT_MAX_REQUEST_SIZE:11MB}
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  address: 0.0.0.0
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    # Transactional email delivery is AFTER_COMMIT and external SMTP outages must not take the API
    # out of service. Mail delivery failures are handled/monitored separately from API readiness.
    mail:
      enabled: false

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN

stripe:
  secret:
    key: ${STRIPE_SECRET_KEY:sk_test_not_configured}
  webhook:
    secret: ${STRIPE_WEBHOOK_SECRET:whsec_not_configured}

dofast:
  security:
    jwt:
      secret: ${JWT_SECRET:local-only-change-this-jwt-secret-please-32-bytes-minimum}
      expiration-ms: ${JWT_EXPIRATION_MS:600000}
    session:
      refresh-ttl-days: ${AUTH_REFRESH_TTL_DAYS:30}
      reuse-grace-seconds: ${AUTH_REFRESH_REUSE_GRACE_SECONDS:15}
      retention-days: ${AUTH_SESSION_RETENTION_DAYS:7}
      cleanup-interval-ms: ${AUTH_SESSION_CLEANUP_INTERVAL_MS:3600000}
      cookie-secure: ${AUTH_COOKIE_SECURE:false}
      same-site: ${AUTH_COOKIE_SAME_SITE:Strict}
    password-recovery:
      delivery: ${PASSWORD_RECOVERY_DELIVERY:disabled}
      token-ttl-minutes: ${PASSWORD_RESET_TTL_MINUTES:30}
      retention-days: ${PASSWORD_RESET_RETENTION_DAYS:7}
      cleanup-interval-ms: ${PASSWORD_RESET_CLEANUP_INTERVAL_MS:3600000}
      reset-base-url: ${PASSWORD_RESET_BASE_URL:}
      from-address: ${PASSWORD_RECOVERY_FROM_ADDRESS:}
    email-verification:
      required: ${EMAIL_VERIFICATION_REQUIRED:false}
      delivery: ${EMAIL_VERIFICATION_DELIVERY:disabled}
      token-ttl-hours: ${EMAIL_VERIFICATION_TTL_HOURS:24}
      retention-days: ${EMAIL_VERIFICATION_RETENTION_DAYS:7}
      cleanup-interval-ms: ${EMAIL_VERIFICATION_CLEANUP_INTERVAL_MS:3600000}
      verify-base-url: ${EMAIL_VERIFICATION_BASE_URL:}
      from-address: ${EMAIL_VERIFICATION_FROM_ADDRESS:}
    admin-bootstrap:
      email: ${ADMIN_BOOTSTRAP_EMAIL:}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:}
      nickname: ${ADMIN_BOOTSTRAP_NICKNAME:doFast Admin}
    websocket:
      allowed-origin-patterns: ${WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
  payments:
    platform-fee-basis-points: ${PLATFORM_FEE_BASIS_POINTS:100}
  payouts:
    provider: ${PAYOUT_PROVIDER:disabled}
    sandbox-enabled: ${PAYOUT_SANDBOX_ENABLED:false}
    minimum-amount: ${PAYOUT_MINIMUM_AMOUNT:1.00}
    max-attempts: ${PAYOUT_MAX_ATTEMPTS:5}
    retry-base-seconds: ${PAYOUT_RETRY_BASE_SECONDS:15}
    stale-processing-seconds: ${PAYOUT_STALE_PROCESSING_SECONDS:300}
    submitted-reconciliation-seconds: ${PAYOUT_SUBMITTED_RECONCILIATION_SECONDS:300}
    dispatch-interval-ms: ${PAYOUT_DISPATCH_INTERVAL_MS:2000}
    stripe-connect:
      enabled: ${PAYOUT_STRIPE_CONNECT_ENABLED:false}
      dispatch-enabled: ${PAYOUT_STRIPE_CONNECT_DISPATCH_ENABLED:false}
      reconciliation-enabled: ${PAYOUT_STRIPE_CONNECT_RECONCILIATION_ENABLED:false}
      reconciliation-interval-ms: ${PAYOUT_STRIPE_CONNECT_RECONCILIATION_INTERVAL_MS:60000}
      country: ${PAYOUT_STRIPE_CONNECT_COUNTRY:PL}
      refresh-url: ${PAYOUT_STRIPE_CONNECT_REFRESH_URL:}
      return-url: ${PAYOUT_STRIPE_CONNECT_RETURN_URL:}
  routing:
    provider: ${ROUTING_PROVIDER:deterministic}
    quote-ttl-minutes: ${ROUTING_QUOTE_TTL_MINUTES:15}
    google:
      api-key: ${GOOGLE_MAPS_ROUTES_API_KEY:}
  tracking:
    eta-refresh-seconds: ${TRACKING_ETA_REFRESH_SECONDS:30}
    eta-refresh-movement-meters: ${TRACKING_ETA_REFRESH_MOVEMENT_METERS:150}
    stale-after-seconds: ${TRACKING_STALE_AFTER_SECONDS:20}
    checkpoint-arrival-radius-meters: ${TRACKING_CHECKPOINT_ARRIVAL_RADIUS_METERS:100}
    max-implied-speed-meters-per-second: ${TRACKING_MAX_IMPLIED_SPEED_METERS_PER_SECOND:80}
    max-accuracy-meters: ${TRACKING_MAX_ACCURACY_METERS:150}
    min-update-interval-millis: ${TRACKING_MIN_UPDATE_INTERVAL_MILLIS:1000}
    max-sample-age-seconds: ${TRACKING_MAX_SAMPLE_AGE_SECONDS:120}
    future-tolerance-seconds: ${TRACKING_FUTURE_TOLERANCE_SECONDS:30}
  attachments:
    storage-root: ${ATTACHMENT_STORAGE_ROOT:./data/attachments}
    encryption-key-base64: ${ATTACHMENT_ENCRYPTION_KEY_BASE64:ZG9mYXN0LWxvY2FsLWF0dGFjaG1lbnQta2V5LTIwMjY=}
    max-file-size-bytes: ${ATTACHMENT_MAX_FILE_SIZE_BYTES:10485760}
    max-per-job: ${ATTACHMENT_MAX_PER_JOB:12}
