spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    show-sql: false

stripe:
  secret:
    key: ${STRIPE_SECRET_KEY}
  webhook:
    secret: ${STRIPE_WEBHOOK_SECRET}

dofast:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  routing:
    provider: ${ROUTING_PROVIDER:google}
    quote-ttl-minutes: ${ROUTING_QUOTE_TTL_MINUTES:15}
    google:
      api-key: ${GOOGLE_MAPS_ROUTES_API_KEY}

logging:
  level:
    com.doFast.dofastapp: INFO
