spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    show-sql: false
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

stripe:
  secret:
    key: ${STRIPE_SECRET_KEY}
  webhook:
    secret: ${STRIPE_WEBHOOK_SECRET}

dofast:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-ms: ${JWT_EXPIRATION_MS:600000}
    session:
      refresh-ttl-days: ${AUTH_REFRESH_TTL_DAYS:30}
      reuse-grace-seconds: ${AUTH_REFRESH_REUSE_GRACE_SECONDS:15}
      retention-days: ${AUTH_SESSION_RETENTION_DAYS:7}
      cleanup-interval-ms: ${AUTH_SESSION_CLEANUP_INTERVAL_MS:3600000}
      cookie-secure: true
      same-site: ${AUTH_COOKIE_SAME_SITE:Strict}
    public-auth-rate-limit:
      max-requests: ${PUBLIC_AUTH_RATE_LIMIT_MAX_REQUESTS:30}
      window-seconds: ${PUBLIC_AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
      max-entries: ${PUBLIC_AUTH_RATE_LIMIT_MAX_ENTRIES:10000}
      trust-forwarded-for: ${PUBLIC_AUTH_RATE_LIMIT_TRUST_FORWARDED_FOR:false}
    public-job-discovery-rate-limit:
      max-requests: ${PUBLIC_JOB_DISCOVERY_RATE_LIMIT_MAX_REQUESTS:120}
      window-seconds: ${PUBLIC_JOB_DISCOVERY_RATE_LIMIT_WINDOW_SECONDS:60}
      max-entries: ${PUBLIC_JOB_DISCOVERY_RATE_LIMIT_MAX_ENTRIES:10000}
      trust-forwarded-for: ${PUBLIC_JOB_DISCOVERY_RATE_LIMIT_TRUST_FORWARDED_FOR:false}
    authenticated-routing-rate-limit:
      max-provider-calls: ${AUTHENTICATED_ROUTING_RATE_LIMIT_MAX_PROVIDER_CALLS:60}
      window-seconds: ${AUTHENTICATED_ROUTING_RATE_LIMIT_WINDOW_SECONDS:60}
      max-entries: ${AUTHENTICATED_ROUTING_RATE_LIMIT_MAX_ENTRIES:10000}
    websocket-rate-limit:
      max-messages: ${WEBSOCKET_INBOUND_RATE_LIMIT_MAX_MESSAGES:120}
      window-seconds: ${WEBSOCKET_INBOUND_RATE_LIMIT_WINDOW_SECONDS:10}
      max-entries: ${WEBSOCKET_INBOUND_RATE_LIMIT_MAX_ENTRIES:10000}
    password-recovery:
      delivery: smtp
      token-ttl-minutes: ${PASSWORD_RESET_TTL_MINUTES:30}
      retention-days: ${PASSWORD_RESET_RETENTION_DAYS:7}
      request-cooldown-seconds: ${PASSWORD_RESET_REQUEST_COOLDOWN_SECONDS:60}
      cleanup-interval-ms: ${PASSWORD_RESET_CLEANUP_INTERVAL_MS:3600000}
      reset-base-url: ${PASSWORD_RESET_BASE_URL}
      from-address: ${PASSWORD_RECOVERY_FROM_ADDRESS}
    email-verification:
      required: true
      delivery: smtp
      token-ttl-hours: ${EMAIL_VERIFICATION_TTL_HOURS:24}
      retention-days: ${EMAIL_VERIFICATION_RETENTION_DAYS:7}
      cleanup-interval-ms: ${EMAIL_VERIFICATION_CLEANUP_INTERVAL_MS:3600000}
      verify-base-url: ${EMAIL_VERIFICATION_BASE_URL}
      from-address: ${EMAIL_VERIFICATION_FROM_ADDRESS}
  payments:
    platform-fee-basis-points: ${PLATFORM_FEE_BASIS_POINTS}
  routing:
    provider: ${ROUTING_PROVIDER:google}
    quote-ttl-minutes: ${ROUTING_QUOTE_TTL_MINUTES:15}
    google:
      api-key: ${GOOGLE_MAPS_ROUTES_API_KEY}
  attachments:
    storage-root: ${ATTACHMENT_STORAGE_ROOT}
    encryption-key-base64: ${ATTACHMENT_ENCRYPTION_KEY_BASE64}
    max-file-size-bytes: ${ATTACHMENT_MAX_FILE_SIZE_BYTES:10485760}
    max-per-job: ${ATTACHMENT_MAX_PER_JOB:12}

logging:
  level:
    com.doFast.dofastapp: INFO
