spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    show-sql: false

stripe:
  secret:
    key: ${STRIPE_SECRET_KEY}
  webhook:
    secret: ${STRIPE_WEBHOOK_SECRET}

dofast:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-ms: ${JWT_EXPIRATION_MS:600000}
    session:
      refresh-ttl-days: ${AUTH_REFRESH_TTL_DAYS:30}
      reuse-grace-seconds: ${AUTH_REFRESH_REUSE_GRACE_SECONDS:15}
      retention-days: ${AUTH_SESSION_RETENTION_DAYS:7}
      cleanup-interval-ms: ${AUTH_SESSION_CLEANUP_INTERVAL_MS:3600000}
      cookie-secure: true
      same-site: ${AUTH_COOKIE_SAME_SITE:Strict}
  payments:
    platform-fee-basis-points: ${PLATFORM_FEE_BASIS_POINTS}
  routing:
    provider: ${ROUTING_PROVIDER:google}
    quote-ttl-minutes: ${ROUTING_QUOTE_TTL_MINUTES:15}
    google:
      api-key: ${GOOGLE_MAPS_ROUTES_API_KEY}
  attachments:
    storage-root: ${ATTACHMENT_STORAGE_ROOT}
    encryption-key-base64: ${ATTACHMENT_ENCRYPTION_KEY_BASE64}
    max-file-size-bytes: ${ATTACHMENT_MAX_FILE_SIZE_BYTES:10485760}
    max-per-job: ${ATTACHMENT_MAX_PER_JOB:12}

logging:
  level:
    com.doFast.dofastapp: INFO
