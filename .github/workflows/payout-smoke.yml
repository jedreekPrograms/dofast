name: Worker payout smoke

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/payout-smoke.yml"
      - ".github/scripts/payout-smoke.sh"
      - ".github/scripts/seed-wallet-funding.sh"
      - ".env.example"
      - "compose.yaml"
      - "apps/api/src/main/java/com/doFast/dofastapp/payout/**"
      - "apps/api/src/main/java/com/doFast/dofastapp/wallet/**"
      - "apps/api/src/main/java/com/doFast/dofastapp/verification/**"
      - "apps/api/src/main/resources/db/migration/V39__worker_payout_requests.sql"
      - "apps/api/src/main/resources/db/migration/V44__stripe_connect_payout_recipients.sql"
      - "apps/api/src/main/resources/db/migration/V45__asynchronous_payout_settlement.sql"
      - "apps/api/src/main/resources/db/migration/V46__stripe_connect_payout_dispatch.sql"
      - "apps/api/src/main/resources/db/migration/V49__wallet_source_of_funds.sql"
      - "apps/web/src/features/wallet/**"
      - "apps/web/src/features/admin/pages/AdminPayoutsPage.jsx"
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/payout-smoke.yml"
      - ".github/scripts/payout-smoke.sh"
      - ".github/scripts/seed-wallet-funding.sh"
      - ".env.example"
      - "compose.yaml"
      - "apps/api/src/main/java/com/doFast/dofastapp/payout/**"
      - "apps/api/src/main/java/com/doFast/dofastapp/wallet/**"
      - "apps/api/src/main/java/com/doFast/dofastapp/verification/**"
      - "apps/api/src/main/resources/db/migration/V39__worker_payout_requests.sql"
      - "apps/api/src/main/resources/db/migration/V44__stripe_connect_payout_recipients.sql"
      - "apps/api/src/main/resources/db/migration/V45__asynchronous_payout_settlement.sql"
      - "apps/api/src/main/resources/db/migration/V46__stripe_connect_payout_dispatch.sql"
      - "apps/api/src/main/resources/db/migration/V49__wallet_source_of_funds.sql"
      - "apps/web/src/features/wallet/**"
      - "apps/web/src/features/admin/pages/AdminPayoutsPage.jsx"

permissions:
  contents: read

concurrency:
  group: payout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  payout-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Prepare sandbox configuration
        shell: bash
        run: |
          cp .env.example .env
          sed -i 's/^ADMIN_BOOTSTRAP_EMAIL=.*/ADMIN_BOOTSTRAP_EMAIL=admin-payout@example.com/' .env
          sed -i 's/^ADMIN_BOOTSTRAP_PASSWORD=.*/ADMIN_BOOTSTRAP_PASSWORD=AdminPayoutPass123!/' .env
          sed -i 's/^ADMIN_BOOTSTRAP_NICKNAME=.*/ADMIN_BOOTSTRAP_NICKNAME=Payout Admin/' .env
          sed -i 's/^PAYOUT_PROVIDER=.*/PAYOUT_PROVIDER=sandbox/' .env
          sed -i 's/^PAYOUT_SANDBOX_ENABLED=.*/PAYOUT_SANDBOX_ENABLED=true/' .env
          sed -i 's/^PAYOUT_STRIPE_CONNECT_ENABLED=.*/PAYOUT_STRIPE_CONNECT_ENABLED=false/' .env
          sed -i 's/^PAYOUT_STRIPE_CONNECT_DISPATCH_ENABLED=.*/PAYOUT_STRIPE_CONNECT_DISPATCH_ENABLED=false/' .env
          # Keep a wide deterministic cancellation window. Production keeps the normal 2s dispatcher cadence.
          sed -i 's/^PAYOUT_DISPATCH_INTERVAL_MS=.*/PAYOUT_DISPATCH_INTERVAL_MS=15000/' .env

      - name: Build API with transient registry retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if docker compose build api; then
              exit 0
            fi
            if test "$attempt" = "3"; then
              echo "API image build failed after $attempt attempts"
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - name: Start PostgreSQL and API
        run: docker compose up -d --no-build db api

      - name: Wait for API
        shell: bash
        run: |
          for attempt in {1..45}; do
            if curl --fail --silent http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs db api
          exit 1

      - name: Verify KYC, reservation, cancellation and sandbox payout lifecycle
        run: bash .github/scripts/payout-smoke.sh

      - name: Diagnostics
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=300 db api

      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans
