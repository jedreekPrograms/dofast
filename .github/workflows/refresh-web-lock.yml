name: Refresh web lockfile

on:
  push:
    branches: ["chore/production-foundation"]

permissions:
  contents: write

jobs:
  refresh:
    if: contains(github.event.head_commit.message, '[refresh-web-lock]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Refresh React Router dependency and lockfile
        working-directory: apps/web
        run: npm install react-router-dom@7.18.2 --save-exact --package-lock-only
      - name: Verify clean install
        working-directory: apps/web
        run: npm ci
      - name: Audit production dependencies
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        working-directory: apps/web
        run: npm run lint
      - name: Build
        working-directory: apps/web
        run: npm run build
      - name: Commit refreshed lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package.json apps/web/package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit"
            exit 0
          fi
          git commit -m "chore(web): patch React Router security issues"
          git push origin HEAD:chore/production-foundation
