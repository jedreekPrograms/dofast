name: Web container health smoke

on:
  push:
    branches: [master, "fix/**", "feat/**"]
    paths:
      - "compose.yaml"
      - "apps/web/Dockerfile"
      - "infra/nginx/default.conf"
      - ".github/workflows/web-container-health-smoke.yml"
  pull_request:
    branches: [master]
    paths:
      - "compose.yaml"
      - "apps/web/Dockerfile"
      - "infra/nginx/default.conf"
      - ".github/workflows/web-container-health-smoke.yml"

permissions:
  contents: read

concurrency:
  group: web-container-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare local configuration
        run: cp .env.example .env
      - name: Build API and web images
        run: docker compose build api web
      - name: Start full local stack
        run: docker compose up -d --no-build db api web
      - name: Wait for Docker web health status
        shell: bash
        run: |
          for attempt in {1..45}; do
            status=$(docker inspect --format='{{.State.Health.Status}}' dofast-web-1)
            if test "$status" = "healthy"; then
              curl --fail --silent http://localhost:5173/health | grep -qx 'ok'
              docker exec dofast-web-1 wget --quiet --tries=1 --spider http://127.0.0.1/health
              exit 0
            fi
            if test "$status" = "unhealthy"; then
              docker inspect dofast-web-1 --format '{{range .State.Health.Log}}{{println .Output}}{{end}}'
              exit 1
            fi
            sleep 2
          done
          docker inspect dofast-web-1 --format '{{json .State.Health}}'
          exit 1
      - name: Verify payment query secrets are not logged or forwarded as referrers
        shell: bash
        run: |
          set -euo pipefail
          secret_marker='pi_smoke_secret_DO_NOT_LOG'
          curl --fail --silent \
            "http://localhost:5173/wallet?topup=return&payment_intent=pi_smoke&payment_intent_client_secret=${secret_marker}&redirect_status=succeeded" \
            >/dev/null
          sleep 1
          if docker logs dofast-web-1 2>&1 | grep -Fq "$secret_marker"; then
            echo "Sensitive Stripe return query was written to the web access log"
            exit 1
          fi
          curl --fail --silent --head http://localhost:5173/wallet \
            | tr -d '\r' \
            | grep -qi '^Referrer-Policy: strict-origin$'
      - name: Verify gateway still reaches API
        shell: bash
        run: |
          curl --fail --silent http://localhost:5173/api/actuator/health | grep -q '"status":"UP"'
      - name: Diagnostics
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs db api web || true
          docker inspect dofast-web-1 --format '{{json .State.Health}}' || true
      - name: Cleanup
        if: always()
        run: docker compose down --remove-orphans
