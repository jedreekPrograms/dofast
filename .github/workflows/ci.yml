name: CI

on:
  push:
    branches: [master, "chore/**", "feature/**", "fix/**", "feat/**"]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: apps/api/pom.xml
      - name: Maven verify
        run: mvn -B -f apps/api/pom.xml verify

  web:
    name: Web verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        working-directory: apps/web
        run: npm ci
      - name: Audit production dependencies
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        working-directory: apps/web
        run: npm run lint
      - name: Build
        working-directory: apps/web
        run: npm run build

  smoke:
    name: Containers and runtime smoke test
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v7
      - name: Prepare local configuration
        run: cp .env.example .env
      - name: Build containers
        run: docker compose build api web
      - name: Start PostgreSQL and API
        run: docker compose up -d --no-build db api
      - name: Verify API health
        shell: bash
        run: |
          for attempt in {1..45}; do
            if curl --fail --silent http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs db api
          exit 1
      - name: Verify PostgreSQL, PostGIS, discovery, auth and escrow
        shell: bash
        run: |
          set -euo pipefail

          POSTGIS_VERSION=$(docker compose exec -T db \
            psql -U dofast -d dofast -tAc \
            "SELECT extversion FROM pg_extension WHERE extname = 'postgis';")
          test -n "${POSTGIS_VERSION//[[:space:]]/}"

          PG_TRGM_VERSION=$(docker compose exec -T db \
            psql -U dofast -d dofast -tAc \
            "SELECT extversion FROM pg_extension WHERE extname = 'pg_trgm';")
          test -n "${PG_TRGM_VERSION//[[:space:]]/}"

          REGISTER_RESPONSE=$(curl --fail --silent \
            -H 'Content-Type: application/json' \
            -d '{"email":"smoke@example.com","nickname":"smokeuser","password":"SmokePass123!"}' \
            http://localhost:8080/users)
          echo "$REGISTER_RESPONSE" | grep -q '"email":"smoke@example.com"'

          TOKEN=$(curl --fail --silent \
            -H 'Content-Type: application/json' \
            -d '{"email":"smoke@example.com","password":"SmokePass123!"}' \
            http://localhost:8080/users/login)
          test -n "$TOKEN"

          ME_RESPONSE=$(curl --fail --silent \
            -H "Authorization: Bearer $TOKEN" \
            http://localhost:8080/users/me)
          echo "$ME_RESPONSE" | grep -q '"email":"smoke@example.com"'

          WALLET_COUNT=$(docker compose exec -T db \
            psql -U dofast -d dofast -tAc \
            "SELECT COUNT(*) FROM wallets w JOIN users u ON u.id = w.user_id WHERE u.email = 'smoke@example.com';")
          test "${WALLET_COUNT//[[:space:]]/}" = "1"

          docker compose exec -T db \
            psql -U dofast -d dofast -c \
            "UPDATE wallets SET balance = 100.00 WHERE user_id = (SELECT id FROM users WHERE email = 'smoke@example.com');"

          PRIVATE_LABEL='ul. Grunwaldzka 10, mieszkanie 5'
          JOB_RESPONSE=$(curl --fail --silent \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"title":"Smoke delivery","description":"Deliver a small package near Plac Grunwaldzki.","price":25.00,"location":{"latitude":51.1128,"longitude":17.0601,"publicLabel":"Wrocław, Plac Grunwaldzki","privateLabel":"ul. Grunwaldzka 10, mieszkanie 5"}}' \
            http://localhost:8080/jobs)
          echo "$JOB_RESPONSE" | grep -q '"status":"OPEN"'
          echo "$JOB_RESPONSE" | grep -q '"locationLabel":"Wrocław, Plac Grunwaldzki"'
          if echo "$JOB_RESPONSE" | grep -Fq "$PRIVATE_LABEL"; then
            echo "Create-job response leaked private location label"
            exit 1
          fi
          JOB_ID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<< "$JOB_RESPONSE")
          test -n "$JOB_ID"

          WALLET_BALANCE=$(docker compose exec -T db \
            psql -U dofast -d dofast -tAc \
            "SELECT balance FROM wallets w JOIN users u ON u.id = w.user_id WHERE u.email = 'smoke@example.com';")
          test "${WALLET_BALANCE//[[:space:]]/}" = "75.00"

          DISCOVERY_RESPONSE=$(curl --fail --silent \
            'http://localhost:8080/jobs?query=delivery&minPrice=20&maxPrice=30&page=0&size=10')
          python3 -c 'import json,sys; d=json.load(sys.stdin); assert len(d["content"]) == 1; assert d["content"][0]["title"] == "Smoke delivery"; assert d["page"] == 0; assert d["size"] == 10; assert d["totalElements"] == 1; assert d["first"] is True; assert d["last"] is True' <<< "$DISCOVERY_RESPONSE"
          if echo "$DISCOVERY_RESPONSE" | grep -Fq "$PRIVATE_LABEL"; then
            echo "Discovery response leaked private location label"
            exit 1
          fi

          PRICE_STATUS=$(curl --silent --output /tmp/invalid-price.json --write-out '%{http_code}' \
            'http://localhost:8080/jobs?minPrice=50&maxPrice=10')
          test "$PRICE_STATUS" = "400"

          NEARBY_RESPONSE=$(curl --fail --silent \
            'http://localhost:8080/jobs/nearby?latitude=51.1120&longitude=17.0610&radiusMeters=2000&limit=10')
          echo "$NEARBY_RESPONSE" | grep -q '"title":"Smoke delivery"'
          echo "$NEARBY_RESPONSE" | grep -q '"distanceMeters":'
          if echo "$NEARBY_RESPONSE" | grep -q '"latitude"\|"longitude"'; then
            echo "Nearby response leaked exact coordinates"
            exit 1
          fi
          if echo "$NEARBY_RESPONSE" | grep -Fq "$PRIVATE_LABEL"; then
            echo "Nearby response leaked private location label"
            exit 1
          fi
          DISTANCE_METERS=$(python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["distanceMeters"])' <<< "$NEARBY_RESPONSE")
          test "$DISTANCE_METERS" -lt 500

          EXACT_LOCATION=$(curl --fail --silent \
            -H "Authorization: Bearer $TOKEN" \
            "http://localhost:8080/jobs/$JOB_ID/location")
          echo "$EXACT_LOCATION" | grep -q '"latitude":51.1128'
          echo "$EXACT_LOCATION" | grep -q '"longitude":17.0601'
          echo "$EXACT_LOCATION" | grep -Fq "$PRIVATE_LABEL"
      - name: Start web gateway
        run: docker compose up -d --no-build web
      - name: Verify web and API gateway
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:5173/health | grep -q 'ok'; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              docker compose ps
              docker compose logs web
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent http://localhost:5173/ | grep -q 'doFast'
          curl --fail --silent 'http://localhost:5173/api/jobs?page=0&size=10' | grep -q '"content"'
          curl --fail --silent \
            'http://localhost:5173/api/jobs/nearby?latitude=51.1120&longitude=17.0610&radiusMeters=2000&limit=10' \
            | grep -q '"title":"Smoke delivery"'
      - name: Print service diagnostics on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=200 db api web
      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans
