name: CI

on:
  push:
    branches: [master, "chore/**", "feature/**", "fix/**", "feat/**"]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: apps/api/pom.xml
      - name: Maven verify
        run: mvn -B -f apps/api/pom.xml verify

  web:
    name: Web verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        working-directory: apps/web
        run: npm ci
      - name: Audit production dependencies
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        working-directory: apps/web
        run: npm run lint
      - name: Build
        working-directory: apps/web
        run: npm run build

  smoke:
    name: Containers and runtime smoke test
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v7
      - name: Prepare local configuration
        shell: bash
        run: |
          cp .env.example .env
          sed -i 's/^ADMIN_BOOTSTRAP_EMAIL=.*/ADMIN_BOOTSTRAP_EMAIL=admin-smoke@example.com/' .env
          sed -i 's/^ADMIN_BOOTSTRAP_PASSWORD=.*/ADMIN_BOOTSTRAP_PASSWORD=AdminSmokePass123!/' .env
          sed -i 's/^ADMIN_BOOTSTRAP_NICKNAME=.*/ADMIN_BOOTSTRAP_NICKNAME=Smoke Admin/' .env
          # The legacy end-to-end smoke intentionally teleports its synthetic courier between route phases.
          # Keep that scenario focused on lifecycle/privacy; the production speed guard has dedicated unit tests.
          sed -i 's/^TRACKING_MAX_IMPLIED_SPEED_METERS_PER_SECOND=.*/TRACKING_MAX_IMPLIED_SPEED_METERS_PER_SECOND=100000/' .env
          # The same synthetic courier is deliberately not positioned at every checkpoint before phase changes.
          # Production keeps the strict arrival radius; focused backend tests exercise proximity enforcement.
          sed -i 's/^TRACKING_CHECKPOINT_ARRIVAL_RADIUS_METERS=.*/TRACKING_CHECKPOINT_ARRIVAL_RADIUS_METERS=100000/' .env
          # The smoke sends two valid GPS samples 100ms apart; keep it focused on the full tracking lifecycle.
          # Production keeps the 1000ms default and the throttle contract is covered by focused backend tests.
          sed -i 's/^TRACKING_MIN_UPDATE_INTERVAL_MILLIS=.*/TRACKING_MIN_UPDATE_INTERVAL_MILLIS=50/' .env
      - name: Build containers
        run: docker compose build api web
      - name: Start PostgreSQL and API
        run: docker compose up -d --no-build db api
      - name: Verify API health
        shell: bash
        run: |
          for attempt in {1..45}; do
            if curl --fail --silent http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs db api
          exit 1
      - name: Verify public job discovery without text query
        run: bash .github/scripts/job-discovery-smoke.sh
      - name: Verify accounts, routing, chat, disputes and escrow
        run: bash .github/scripts/runtime-smoke.sh
      - name: Verify multi-stop routing and tracking
        run: bash .github/scripts/multi-stop-routing-smoke.sh
      - name: Verify on-site jobs and exact-location privacy
        run: bash .github/scripts/on-site-job-smoke.sh
      - name: Verify nearby PostGIS category filtering
        run: bash .github/scripts/nearby-category-smoke.sh
      - name: Verify encrypted job attachments and lifecycle privacy
        run: bash .github/scripts/job-attachments-smoke.sh
      - name: Start web gateway
        run: docker compose up -d --no-build web
      - name: Verify web container and API gateway
        shell: bash
        run: |
          for attempt in {1..30}; do
            status=$(docker inspect --format='{{.State.Health.Status}}' dofast-web-1)
            if test "$status" = "healthy"; then
              break
            fi
            if test "$status" = "unhealthy"; then
              docker inspect dofast-web-1 --format '{{range .State.Health.Log}}{{println .Output}}{{end}}'
              exit 1
            fi
            sleep 2
          done
          test "$(docker inspect --format='{{.State.Health.Status}}' dofast-web-1)" = "healthy"
          curl --fail --silent http://localhost:5173/health | grep -qx 'ok'
          curl --fail --silent http://localhost:5173/api/actuator/health | grep -q '"status":"UP"'
      - name: Print service diagnostics on failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs db api web || true
      - name: Cleanup
        if: always()
        run: docker compose down --remove-orphans
