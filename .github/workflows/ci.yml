name: CI

on:
  push:
    branches: [master, "chore/**", "feature/**", "fix/**"]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: apps/api/pom.xml
      - name: Maven verify
        run: mvn -B -f apps/api/pom.xml verify

  web:
    name: Web verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        working-directory: apps/web
        run: npm ci
      - name: Audit production dependencies
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        working-directory: apps/web
        run: npm run lint
      - name: Build
        working-directory: apps/web
        run: npm run build

  smoke:
    name: Containers and runtime smoke test
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v7
      - name: Prepare local configuration
        run: cp .env.example .env
      - name: Build containers
        run: docker compose build api web
      - name: Start database and API
        run: docker compose up -d --no-build db api
      - name: Verify API health
        shell: bash
        run: |
          for attempt in {1..45}; do
            if curl --fail --silent http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs db api
          exit 1
      - name: Validate web container starts
        run: docker compose up -d --no-build web
      - name: Verify web health
        shell: bash
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:5173/health | grep -q 'ok'; then
              exit 0
            fi
            sleep 1
          done
          docker compose ps
          docker compose logs web
          exit 1
      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans
