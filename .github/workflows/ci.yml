name: CI

on:
  push:
    branches: [master, "chore/**", "feature/**", "fix/**", "feat/**"]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: apps/api/pom.xml
      - name: Maven verify
        run: mvn -B -f apps/api/pom.xml verify

  web:
    name: Web verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        working-directory: apps/web
        run: npm ci
      - name: Audit production dependencies
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        working-directory: apps/web
        run: npm run lint
      - name: Build
        working-directory: apps/web
        run: npm run build

  smoke:
    name: Containers and runtime smoke test
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v7
      - name: Prepare local configuration
        shell: bash
        run: |
          cp .env.example .env
          sed -i 's/^ADMIN_BOOTSTRAP_EMAIL=.*/ADMIN_BOOTSTRAP_EMAIL=admin-smoke@example.com/' .env
          sed -i 's/^ADMIN_BOOTSTRAP_PASSWORD=.*/ADMIN_BOOTSTRAP_PASSWORD=AdminSmokePass123!/' .env
          sed -i 's/^ADMIN_BOOTSTRAP_NICKNAME=.*/ADMIN_BOOTSTRAP_NICKNAME=Smoke Admin/' .env
      - name: Build containers
        run: docker compose build api web
      - name: Start PostgreSQL and API
        run: docker compose up -d --no-build db api
      - name: Verify API health
        shell: bash
        run: |
          for attempt in {1..45}; do
            if curl --fail --silent http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs db api
          exit 1
      - name: Verify accounts, chat, notifications, disputes, admin and escrow
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "Smoke assertion failed at script line $LINENO"' ERR

          POSTGIS_VERSION=$(docker compose exec -T db psql -U dofast -d dofast -tAc "SELECT extversion FROM pg_extension WHERE extname = 'postgis';")
          test -n "${POSTGIS_VERSION//[[:space:]]/}"
          PG_TRGM_VERSION=$(docker compose exec -T db psql -U dofast -d dofast -tAc "SELECT extversion FROM pg_extension WHERE extname = 'pg_trgm';")
          test -n "${PG_TRGM_VERSION//[[:space:]]/}"

          REGISTER_RESPONSE=$(curl --fail --silent \
            -H 'Content-Type: application/json' \
            -d '{"email":"smoke@example.com","nickname":"smokeuser","password":"SmokePass123!"}' \
            http://localhost:8080/users)
          echo "$REGISTER_RESPONSE" | grep -q '"email":"smoke@example.com"'
          echo "$REGISTER_RESPONSE" | grep -q '"role":"USER"'
          echo "$REGISTER_RESPONSE" | grep -q '"status":"ACTIVE"'
          USER_ID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<< "$REGISTER_RESPONSE")

          LOGIN_RESPONSE=$(curl --fail --silent \
            -H 'Content-Type: application/json' \
            -d '{"email":"smoke@example.com","password":"SmokePass123!"}' \
            http://localhost:8080/users/login)
          TOKEN=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["accessToken"])' <<< "$LOGIN_RESPONSE")
          test -n "$TOKEN"

          WORKER_REGISTER=$(curl --fail --silent \
            -H 'Content-Type: application/json' \
            -d '{"email":"worker-smoke@example.com","nickname":"smokeworker","password":"WorkerPass123!"}' \
            http://localhost:8080/users)
          echo "$WORKER_REGISTER" | grep -q '"role":"USER"'
          WORKER_LOGIN=$(curl --fail --silent \
            -H 'Content-Type: application/json' \
            -d '{"email":"worker-smoke@example.com","password":"WorkerPass123!"}' \
            http://localhost:8080/users/login)
          WORKER_TOKEN=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["accessToken"])' <<< "$WORKER_LOGIN")
          test -n "$WORKER_TOKEN"

          OUTSIDER_REGISTER=$(curl --fail --silent \
            -H 'Content-Type: application/json' \
            -d '{"email":"outsider-smoke@example.com","nickname":"smokeoutsider","password":"OutsiderPass123!"}' \
            http://localhost:8080/users)
          echo "$OUTSIDER_REGISTER" | grep -q '"role":"USER"'
          OUTSIDER_LOGIN=$(curl --fail --silent \
            -H 'Content-Type: application/json' \
            -d '{"email":"outsider-smoke@example.com","password":"OutsiderPass123!"}' \
            http://localhost:8080/users/login)
          OUTSIDER_TOKEN=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["accessToken"])' <<< "$OUTSIDER_LOGIN")
          test -n "$OUTSIDER_TOKEN"

          ME_RESPONSE=$(curl --fail --silent -H "Authorization: Bearer $TOKEN" http://localhost:8080/users/me)
          echo "$ME_RESPONSE" | grep -q '"email":"smoke@example.com"'
          echo "$ME_RESPONSE" | grep -q '"role":"USER"'

          ADMIN_LOGIN=$(curl --fail --silent \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin-smoke@example.com","password":"AdminSmokePass123!"}' \
            http://localhost:8080/users/login)
          ADMIN_TOKEN=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["accessToken"])' <<< "$ADMIN_LOGIN")
          echo "$ADMIN_LOGIN" | grep -q '"role":"ADMIN"'

          ADMIN_OVERVIEW=$(curl --fail --silent -H "Authorization: Bearer $ADMIN_TOKEN" http://localhost:8080/admin/overview)
          echo "$ADMIN_OVERVIEW" | grep -q '"totalUsers":4'

          USER_ADMIN_STATUS=$(curl --silent --output /tmp/user-admin.json --write-out '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" http://localhost:8080/admin/users)
          test "$USER_ADMIN_STATUS" = "403"

          WALLET_COUNT=$(docker compose exec -T db psql -U dofast -d dofast -tAc \
            "SELECT COUNT(*) FROM wallets w JOIN users u ON u.id = w.user_id WHERE u.email IN ('smoke@example.com', 'worker-smoke@example.com', 'outsider-smoke@example.com');")
          test "${WALLET_COUNT//[[:space:]]/}" = "3"

          docker compose exec -T db psql -U dofast -d dofast -c \
            "UPDATE wallets SET balance = 100.00 WHERE user_id = (SELECT id FROM users WHERE email = 'smoke@example.com');"

          PRIVATE_LABEL='ul. Grunwaldzka 10, mieszkanie 5'
          JOB_RESPONSE=$(curl --fail --silent \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"title":"Smoke delivery","description":"Deliver a small package near Plac Grunwaldzki.","price":25.00,"location":{"latitude":51.1128,"longitude":17.0601,"publicLabel":"Wrocław, Plac Grunwaldzki","privateLabel":"ul. Grunwaldzka 10, mieszkanie 5"}}' \
            http://localhost:8080/jobs)
          echo "$JOB_RESPONSE" | grep -q '"status":"OPEN"'
          if echo "$JOB_RESPONSE" | grep -Fq "$PRIVATE_LABEL"; then
            echo "Create-job response leaked private location label"
            exit 1
          fi
          JOB_ID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<< "$JOB_RESPONSE")

          MY_JOBS=$(curl --fail --silent -H "Authorization: Bearer $TOKEN" http://localhost:8080/jobs/my)
          echo "$MY_JOBS" | grep -q '"title":"Smoke delivery"'

          WALLET_BALANCE=$(docker compose exec -T db psql -U dofast -d dofast -tAc \
            "SELECT balance FROM wallets w JOIN users u ON u.id = w.user_id WHERE u.email = 'smoke@example.com';")
          test "${WALLET_BALANCE//[[:space:]]/}" = "75.00"

          DISCOVERY_RESPONSE=$(curl --fail --silent 'http://localhost:8080/jobs?query=delivery&minPrice=20&maxPrice=30&page=0&size=10')
          python3 -c 'import json,sys; d=json.load(sys.stdin); assert len(d["content"]) == 1; assert d["content"][0]["title"] == "Smoke delivery"; assert d["totalElements"] == 1' <<< "$DISCOVERY_RESPONSE"
          if echo "$DISCOVERY_RESPONSE" | grep -Fq "$PRIVATE_LABEL"; then
            echo "Discovery response leaked private location label"
            exit 1
          fi

          NEARBY_RESPONSE=$(curl --fail --silent 'http://localhost:8080/jobs/nearby?latitude=51.1120&longitude=17.0610&radiusMeters=2000&limit=10')
          echo "$NEARBY_RESPONSE" | grep -q '"title":"Smoke delivery"'
          if echo "$NEARBY_RESPONSE" | grep -q '"latitude"\|"longitude"'; then
            echo "Nearby response leaked exact coordinates"
            exit 1
          fi

          ACCEPT_RESPONSE=$(curl --fail --silent -X POST \
            -H "Authorization: Bearer $WORKER_TOKEN" \
            "http://localhost:8080/jobs/$JOB_ID/accept")
          echo "$ACCEPT_RESPONSE" | grep -q '"status":"IN_PROGRESS"'

          OWNER_NOTIFICATIONS=$(curl --fail --silent -H "Authorization: Bearer $TOKEN" \
            'http://localhost:8080/notifications?page=0&size=20')
          echo "$OWNER_NOTIFICATIONS" | grep -q '"type":"JOB_ACCEPTED"'
          OWNER_UNREAD=$(curl --fail --silent -H "Authorization: Bearer $TOKEN" \
            http://localhost:8080/notifications/unread-count)
          python3 -c 'import json,sys; assert json.load(sys.stdin)["unreadCount"] >= 1' <<< "$OWNER_UNREAD"

          WORKER_LOCATION=$(curl --fail --silent -H "Authorization: Bearer $WORKER_TOKEN" "http://localhost:8080/jobs/$JOB_ID/location")
          echo "$WORKER_LOCATION" | grep -q '"latitude":51.1128'
          echo "$WORKER_LOCATION" | grep -Fq "$PRIVATE_LABEL"

          CHAT_CLIENT_ID='11111111-2222-4333-8444-555555555555'
          CHAT_RESPONSE=$(curl --fail --silent \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d "{\"content\":\"Smoke chat evidence message\",\"clientMessageId\":\"$CHAT_CLIENT_ID\"}" \
            "http://localhost:8080/chat/jobs/$JOB_ID/messages")
          echo "$CHAT_RESPONSE" | grep -q '"content":"Smoke chat evidence message"'
          CHAT_MESSAGE_ID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<< "$CHAT_RESPONSE")
          CHAT_SENDER_ID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["senderId"])' <<< "$CHAT_RESPONSE")
          test "$CHAT_SENDER_ID" = "$USER_ID"

          CHAT_RETRY=$(curl --fail --silent \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d "{\"content\":\"Smoke chat evidence message\",\"clientMessageId\":\"$CHAT_CLIENT_ID\"}" \
            "http://localhost:8080/chat/jobs/$JOB_ID/messages")
          RETRY_MESSAGE_ID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<< "$CHAT_RETRY")
          test "$RETRY_MESSAGE_ID" = "$CHAT_MESSAGE_ID"

          CHAT_DB_COUNT=$(docker compose exec -T db psql -U dofast -d dofast -tAc \
            "SELECT COUNT(*) FROM chat_messages WHERE client_message_id = '$CHAT_CLIENT_ID';")
          test "${CHAT_DB_COUNT//[[:space:]]/}" = "1"

          WORKER_HISTORY=$(curl --fail --silent -H "Authorization: Bearer $WORKER_TOKEN" \
            "http://localhost:8080/chat/jobs/$JOB_ID/messages?limit=20")
          echo "$WORKER_HISTORY" | grep -q '"content":"Smoke chat evidence message"'

          OUTSIDER_CHAT_STATUS=$(curl --silent --output /tmp/outsider-chat.json --write-out '%{http_code}' \
            -H "Authorization: Bearer $OUTSIDER_TOKEN" \
            "http://localhost:8080/chat/jobs/$JOB_ID/messages?limit=20")
          test "$OUTSIDER_CHAT_STATUS" = "403"

          WORKER_CONVERSATIONS=$(curl --fail --silent -H "Authorization: Bearer $WORKER_TOKEN" \
            http://localhost:8080/chat/conversations)
          python3 -c 'import json,sys; d=json.load(sys.stdin); assert len(d) == 1; assert d[0]["unreadCount"] == 1' <<< "$WORKER_CONVERSATIONS"

          WORKER_NOTIFICATIONS=$(curl --fail --silent -H "Authorization: Bearer $WORKER_TOKEN" \
            'http://localhost:8080/notifications?page=0&size=20')
          echo "$WORKER_NOTIFICATIONS" | grep -q '"type":"CHAT_MESSAGE"'

          curl --fail --silent --output /dev/null -X POST \
            -H "Authorization: Bearer $WORKER_TOKEN" \
            -H 'Content-Type: application/json' \
            -d "{\"lastMessageId\":$CHAT_MESSAGE_ID}" \
            "http://localhost:8080/chat/jobs/$JOB_ID/read"

          WORKER_CONVERSATIONS_READ=$(curl --fail --silent -H "Authorization: Bearer $WORKER_TOKEN" \
            http://localhost:8080/chat/conversations)
          python3 -c 'import json,sys; d=json.load(sys.stdin); assert d[0]["unreadCount"] == 0' <<< "$WORKER_CONVERSATIONS_READ"

          DISPUTE_RESPONSE=$(curl --fail --silent \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d "{\"jobId\":$JOB_ID,\"reason\":\"NOT_COMPLETED\",\"description\":\"Smoke dispute requiring admin review\"}" \
            http://localhost:8080/disputes)
          echo "$DISPUTE_RESPONSE" | grep -q '"status":"OPEN"'
          echo "$DISPUTE_RESPONSE" | grep -q '"previousJobStatus":"IN_PROGRESS"'
          DISPUTE_ID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["dispute"]["id"])' <<< "$DISPUTE_RESPONSE")

          DISPUTED_JOB=$(curl --fail --silent -H "Authorization: Bearer $TOKEN" "http://localhost:8080/jobs/$JOB_ID")
          echo "$DISPUTED_JOB" | grep -q '"status":"DISPUTED"'

          DISPUTED_WORKER_LOCATION=$(curl --fail --silent -H "Authorization: Bearer $WORKER_TOKEN" "http://localhost:8080/jobs/$JOB_ID/location")
          echo "$DISPUTED_WORKER_LOCATION" | grep -Fq "$PRIVATE_LABEL"

          COMPLETION_DURING_DISPUTE=$(curl --silent --output /tmp/completion-disputed.json --write-out '%{http_code}' \
            -X POST -H "Authorization: Bearer $WORKER_TOKEN" "http://localhost:8080/jobs/$JOB_ID/completion")
          test "$COMPLETION_DURING_DISPUTE" = "409"

          ESCROW_HELD=$(docker compose exec -T db psql -U dofast -d dofast -tAc \
            "SELECT status FROM escrow_transactions WHERE job_id = $JOB_ID;")
          test "${ESCROW_HELD//[[:space:]]/}" = "HELD"

          USER_DISPUTE_ADMIN_STATUS=$(curl --silent --output /tmp/user-admin-disputes.json --write-out '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" 'http://localhost:8080/admin/disputes?page=0&size=10')
          test "$USER_DISPUTE_ADMIN_STATUS" = "403"

          USER_EVIDENCE_STATUS=$(curl --silent --output /tmp/user-admin-evidence.json --write-out '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            "http://localhost:8080/admin/disputes/$DISPUTE_ID/messages?limit=100")
          test "$USER_EVIDENCE_STATUS" = "403"

          ADMIN_DISPUTES=$(curl --fail --silent -H "Authorization: Bearer $ADMIN_TOKEN" \
            'http://localhost:8080/admin/disputes?status=OPEN&page=0&size=10')
          python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["totalElements"] == 1; assert d["content"][0]["status"] == "OPEN"' <<< "$ADMIN_DISPUTES"

          ADMIN_EVIDENCE=$(curl --fail --silent -H "Authorization: Bearer $ADMIN_TOKEN" \
            "http://localhost:8080/admin/disputes/$DISPUTE_ID/messages?limit=100")
          echo "$ADMIN_EVIDENCE" | grep -q '"content":"Smoke chat evidence message"'

          CLAIM_RESPONSE=$(curl --fail --silent -X POST \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            "http://localhost:8080/admin/disputes/$DISPUTE_ID/claim")
          echo "$CLAIM_RESPONSE" | grep -q '"status":"UNDER_REVIEW"'

          RESOLVE_RESPONSE=$(curl --fail --silent \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"resolution":"REFUND_TO_REQUESTER","note":"Smoke evidence supports requester refund"}' \
            "http://localhost:8080/admin/disputes/$DISPUTE_ID/resolve")
          echo "$RESOLVE_RESPONSE" | grep -q '"status":"RESOLVED"'
          echo "$RESOLVE_RESPONSE" | grep -q '"resolution":"REFUND_TO_REQUESTER"'

          RESOLVED_JOB=$(curl --fail --silent -H "Authorization: Bearer $TOKEN" "http://localhost:8080/jobs/$JOB_ID")
          echo "$RESOLVED_JOB" | grep -q '"status":"CANCELLED"'

          CLOSED_CHAT_SEND_STATUS=$(curl --silent --output /tmp/closed-chat-send.json --write-out '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"content":"This must not be accepted","clientMessageId":"99999999-2222-4333-8444-555555555555"}' \
            "http://localhost:8080/chat/jobs/$JOB_ID/messages")
          test "$CLOSED_CHAT_SEND_STATUS" = "409"

          REFUNDED_BALANCE=$(docker compose exec -T db psql -U dofast -d dofast -tAc \
            "SELECT balance FROM wallets w JOIN users u ON u.id = w.user_id WHERE u.email = 'smoke@example.com';")
          test "${REFUNDED_BALANCE//[[:space:]]/}" = "100.00"

          ESCROW_REFUNDED=$(docker compose exec -T db psql -U dofast -d dofast -tAc \
            "SELECT status FROM escrow_transactions WHERE job_id = $JOB_ID;")
          test "${ESCROW_REFUNDED//[[:space:]]/}" = "REFUNDED"

          DISPUTE_EVENT_COUNT=$(docker compose exec -T db psql -U dofast -d dofast -tAc \
            "SELECT COUNT(*) FROM dispute_events WHERE dispute_id = $DISPUTE_ID;")
          test "${DISPUTE_EVENT_COUNT//[[:space:]]/}" = "3"

          NOTIFICATION_COUNT=$(docker compose exec -T db psql -U dofast -d dofast -tAc \
            "SELECT COUNT(*) FROM notifications;")
          test "${NOTIFICATION_COUNT//[[:space:]]/}" -ge "6"

          CHAT_READ_STATE_COUNT=$(docker compose exec -T db psql -U dofast -d dofast -tAc \
            "SELECT COUNT(*) FROM chat_read_states WHERE job_id = $JOB_ID;")
          test "${CHAT_READ_STATE_COUNT//[[:space:]]/}" = "1"

          MY_DISPUTES=$(curl --fail --silent -H "Authorization: Bearer $TOKEN" http://localhost:8080/disputes/my)
          echo "$MY_DISPUTES" | grep -q '"resolution":"REFUND_TO_REQUESTER"'

          SUSPEND_RESPONSE=$(curl --fail --silent \
            -X PATCH \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"status":"SUSPENDED"}' \
            "http://localhost:8080/admin/users/$USER_ID/status")
          echo "$SUSPEND_RESPONSE" | grep -q '"status":"SUSPENDED"'

          SUSPENDED_ME_STATUS=$(curl --silent --output /tmp/suspended-me.json --write-out '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" http://localhost:8080/users/me)
          test "$SUSPENDED_ME_STATUS" = "401"

          SUSPENDED_LOGIN_STATUS=$(curl --silent --output /tmp/suspended-login.json --write-out '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"email":"smoke@example.com","password":"SmokePass123!"}' \
            http://localhost:8080/users/login)
          test "$SUSPENDED_LOGIN_STATUS" = "403"
      - name: Start web gateway
        run: docker compose up -d --no-build web
      - name: Verify web and API gateway
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:5173/health | grep -q 'ok'; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              docker compose ps
              docker compose logs web
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://localhost:5173/ | grep -q 'doFast'
          curl --fail --silent 'http://localhost:5173/api/jobs?page=0&size=10' | grep -q '"content"'
      - name: Print service diagnostics on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=200 db api web
      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans
