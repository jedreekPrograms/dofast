name: Job cancellation smoke

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/job-cancellation-smoke.yml"
      - ".github/scripts/job-cancellation-smoke.sh"
      - "apps/api/src/main/java/com/doFast/dofastapp/job/cancellation/**"
      - "apps/api/src/main/resources/db/migration/V16__job_cancellation_agreements.sql"
  push:
    branches: [master]
    paths:
      - ".github/workflows/job-cancellation-smoke.yml"
      - ".github/scripts/job-cancellation-smoke.sh"
      - "apps/api/src/main/java/com/doFast/dofastapp/job/cancellation/**"
      - "apps/api/src/main/resources/db/migration/V16__job_cancellation_agreements.sql"

permissions:
  contents: read

concurrency:
  group: job-cancellation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cancellation-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Prepare local configuration
        run: cp .env.example .env

      - name: Build API with transient registry retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if docker compose build api; then
              exit 0
            fi
            if test "$attempt" = "3"; then
              echo "API image build failed after $attempt attempts"
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - name: Start PostgreSQL and API
        run: docker compose up -d --no-build db api

      - name: Wait for API
        shell: bash
        run: |
          for attempt in {1..45}; do
            if curl --fail --silent http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs db api
          exit 1

      - name: Verify negotiated cancellation, refund and tracking shutdown
        run: bash .github/scripts/job-cancellation-smoke.sh

      - name: Diagnostics
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --tail=250 db api || true

      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans
