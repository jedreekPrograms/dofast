name: Payments ledger smoke

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/payments-ledger-smoke.yml"
      - ".github/scripts/payments-ledger-smoke.sh"
      - ".github/scripts/stripe-wallet-purpose-reconciliation-smoke.sh"
      - "apps/api/src/main/java/com/doFast/dofastapp/payment/**"
      - "apps/api/src/main/java/com/doFast/dofastapp/wallet/**"
      - "apps/api/src/main/java/com/doFast/dofastapp/job/**"
      - "apps/api/src/main/java/com/doFast/dofastapp/location/routing/**"
      - "apps/api/src/main/java/com/doFast/dofastapp/dispute/**"
      - "apps/api/src/main/resources/db/migration/V9__payments_and_ledger_hardening.sql"
      - "apps/api/src/main/resources/db/migration/V38__platform_fee_settlement.sql"
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/payments-ledger-smoke.yml"
      - ".github/scripts/payments-ledger-smoke.sh"
      - ".github/scripts/stripe-wallet-purpose-reconciliation-smoke.sh"
      - "apps/api/src/main/java/com/doFast/dofastapp/payment/**"
      - "apps/api/src/main/java/com/doFast/dofastapp/wallet/**"
      - "apps/api/src/main/java/com/doFast/dofastapp/job/**"
      - "apps/api/src/main/java/com/doFast/dofastapp/location/routing/**"
      - "apps/api/src/main/java/com/doFast/dofastapp/dispute/**"
      - "apps/api/src/main/resources/db/migration/V9__payments_and_ledger_hardening.sql"
      - "apps/api/src/main/resources/db/migration/V38__platform_fee_settlement.sql"

permissions:
  contents: read

concurrency:
  group: payments-ledger-${{ github.ref }}
  cancel-in-progress: true

jobs:
  payments-ledger-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Prepare local configuration
        shell: bash
        run: |
          cp .env.example .env
          sed -i 's/^ADMIN_BOOTSTRAP_EMAIL=.*/ADMIN_BOOTSTRAP_EMAIL=admin-ledger@example.com/' .env
          sed -i 's/^ADMIN_BOOTSTRAP_PASSWORD=.*/ADMIN_BOOTSTRAP_PASSWORD=AdminLedgerPass123!/' .env
          sed -i 's/^ADMIN_BOOTSTRAP_NICKNAME=.*/ADMIN_BOOTSTRAP_NICKNAME=Ledger Admin/' .env
          # This workflow isolates wallet concurrency/idempotency and preserves its historical gross-release assertions.
          # The dedicated Platform fee settlement smoke exercises the production 1% gross/fee/net path.
          sed -i 's/^PLATFORM_FEE_BASIS_POINTS=.*/PLATFORM_FEE_BASIS_POINTS=0/' .env

      - name: Build API with transient registry retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if docker compose build api; then
              exit 0
            fi
            if test "$attempt" = "3"; then
              echo "API image build failed after $attempt attempts"
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - name: Start PostgreSQL and API
        run: docker compose up -d --no-build db api

      - name: Wait for API
        shell: bash
        run: |
          for attempt in {1..45}; do
            if curl --fail --silent http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs db api
          exit 1

      - name: Verify concurrent debit, escrow release, refund and reconciliation
        run: bash .github/scripts/payments-ledger-smoke.sh

      - name: Verify Stripe purpose to wallet type reconciliation
        run: bash .github/scripts/stripe-wallet-purpose-reconciliation-smoke.sh

      - name: Diagnostics
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=250 db api

      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans
