name: Email verification smoke

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/email-verification-smoke.yml"
      - ".github/scripts/email-verification-smoke.sh"
      - ".env.example"
      - "compose.yaml"
      - "apps/api/src/main/java/com/doFast/dofastapp/config/SecurityConfig.java"
      - "apps/api/src/main/java/com/doFast/dofastapp/user/auth/email/**"
      - "apps/api/src/main/java/com/doFast/dofastapp/user/service/UserService.java"
      - "apps/api/src/main/java/com/doFast/dofastapp/user/entity/User.java"
      - "apps/api/src/main/resources/application.yml"
      - "apps/api/src/main/resources/application-prod.yml"
      - "apps/api/src/main/resources/db/migration/V52__email_verification.sql"
  push:
    branches: [master]
    paths:
      - ".github/workflows/email-verification-smoke.yml"
      - ".github/scripts/email-verification-smoke.sh"
      - ".env.example"
      - "compose.yaml"
      - "apps/api/src/main/java/com/doFast/dofastapp/config/SecurityConfig.java"
      - "apps/api/src/main/java/com/doFast/dofastapp/user/auth/email/**"
      - "apps/api/src/main/java/com/doFast/dofastapp/user/service/UserService.java"
      - "apps/api/src/main/java/com/doFast/dofastapp/user/entity/User.java"
      - "apps/api/src/main/resources/application.yml"
      - "apps/api/src/main/resources/application-prod.yml"
      - "apps/api/src/main/resources/db/migration/V52__email_verification.sql"

permissions:
  contents: read

concurrency:
  group: email-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  email-verification-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Prepare mandatory verification configuration
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          sed -i 's/^EMAIL_VERIFICATION_REQUIRED=.*/EMAIL_VERIFICATION_REQUIRED=true/' .env
          sed -i 's/^EMAIL_VERIFICATION_DELIVERY=.*/EMAIL_VERIFICATION_DELIVERY=smtp/' .env
          sed -i 's|^EMAIL_VERIFICATION_BASE_URL=.*|EMAIL_VERIFICATION_BASE_URL=https://app.example.test/verify-email|' .env
          sed -i 's/^EMAIL_VERIFICATION_FROM_ADDRESS=.*/EMAIL_VERIFICATION_FROM_ADDRESS=security@example.test/' .env
          # The SMTP connection intentionally fails quickly. Delivery is AFTER_COMMIT and isolated from the HTTP
          # request; the smoke replaces only the persisted SHA-256 hash with a known CI credential afterward.
          sed -i 's/^SMTP_HOST=.*/SMTP_HOST=127.0.0.1/' .env
          sed -i 's/^SMTP_PORT=.*/SMTP_PORT=2525/' .env

      - name: Build API with transient registry retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if docker compose build api; then
              exit 0
            fi
            if test "$attempt" = "3"; then
              echo "API image build failed after $attempt attempts"
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - name: Start PostgreSQL and API
        run: docker compose up -d --no-build db api

      - name: Wait for API
        shell: bash
        run: |
          for attempt in {1..45}; do
            if curl --fail --silent http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs db api
          exit 1

      - name: Verify local email verification gate and one-time credential
        run: bash .github/scripts/email-verification-smoke.sh

      - name: Diagnostics
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --tail=250 db api || true

      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans
