version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:20"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"

  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:40"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 3
    rebase-strategy: "auto"
